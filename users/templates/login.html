{% extends 'catalog/base.html' %}

{% block title%} Login {% endblock%}


{% block content %}
<div class="container">
    <h2> Войти на сайт</h2>
   <form class="row" method = "post" enctype="multipart/form-data">
     <div class="col-lg-6 col-md-8 col-sm-10">
       <div class="card">
           <div class="card-body">
             {% csrf_token %}
             {{form.as_p}}
           </div>
             <button type="submit" class="btn btn-primary">
               Войти
             </button>

       </div>
     </div>
   </form>
</div>
{% endblock %}
