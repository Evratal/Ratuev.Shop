<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение удаления</title>
</head>
<body>
    <h1>Удалить статью "{{ post.title }}"?</h1>
    <p>Вы уверены, что хотите удалить эту статью?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <br>
    <a href="{% url 'post_list' %}">Отмена</a>
</body>
</html>
