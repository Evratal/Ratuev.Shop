<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p>Создано: {{ post.created_at }}</p>
    <p>{{ post.content }}</p>
    {% if post.preview_image %}
        <img src="{{ post.preview_image.url }}" alt="{{ post.title }} Preview">
    {% endif %}
    <p>Просмотры: {{ post.views_count }}</p>
    <a href="{% url 'post_edit' post.pk %}">Редактировать</a>
    <form action="{% url 'post_delete' post.pk %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <br>
    <a href="{% url 'post_list' %}">Назад к списку статей</a>
</body>
</html>
