<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список статей</title>
</head>
<body>
    <h1>Список статей</h1>
    <a href="{% url 'blog:post_create' %}">Создать новую статью</a>
        <ul>
            {% for post in object_list %}
                <li>
                    <a class="btn btn-primary" href="{% url 'blog:post_detail' post.pk %}" role="button">Посмотреть {{ post.title }}</a>
                    <a class="btn btn-primary" href="{% url 'blog:post_update' post.pk %}" role="button">Редактировать {{ post.title }}</a>
                    <a class="btn btn-primary" href="{% url 'blog:post_delete' post.pk %}" role="button">Удалить {{ post.title }}</a>
                    <p>Просмотры: {{ post.views_count }}</p>
                </li>
            {% endfor %}
        </ul>
</body>
</html>
